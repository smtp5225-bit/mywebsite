<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🛠️ Practical & Viva | Polytechnic Hub</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<main class="section">
<a href="/" style="text-decoration:none;">← Back</a>
<div class="section-title">
<h1>🛠️ Practical & Viva</h1>
<p>Practical preparation and viva guidance</p>
</div>
<div class="feature-grid" id="list"></div>
</main>

<script>
const list=document.getElementById("list");
const category='Practical';

for(let i=1;i<=6;i++){
  const a=document.createElement("a");
  a.className="feature-card";
  a.style.textDecoration="none";
  a.style.color="inherit";
  a.href="semester.html?category="+encodeURIComponent(category)+"&sem="+i;
  a.innerHTML="<div class='feature-icon'>📚</div><h2>Semester "+i+"</h2><p>View Practical & Viva →</p>";
  list.appendChild(a);
}
</script>
</body>
</html>
