<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Subjects</title><link rel="stylesheet" href="../style.css"></head><body><main class="section"><h1 id="title"></h1><div id="list"></div></main><script>const p=new URLSearchParams(location.search),b=p.get("branch"),s=p.get("sem"),subjects=["Engineering Mathematics","Applied Physics","Applied Chemistry","Communication Skills","Computer Fundamentals"];document.getElementById("title").textContent=b+" — Semester "+s+" — Subjects";subjects.forEach(x=>list.innerHTML+=`<a class="feature-card" href="year.html?branch=${encodeURIComponent(b)}&sem=${s}&subject=${encodeURIComponent(x)}"><h2>${x}</h2><p>View papers</p></a>`)</script></body></html>
